services:
  # ──────────────────────────────────────────────────────────────
  # Backend — Django REST API (Python)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: herbal-medicine-api
    runtime: python
    region: oma
    plan: free
    buildCommand: "pip install -r requirements.txt && python herbal_medicine/manage.py collectstatic --noinput && python herbal_medicine/manage.py migrate"
    startCommand: "gunicorn herbal_medicine.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: herbal_medicine.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "herbal-medicine-api.onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://herbal-medicine-api.onrender.com"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: DB_NAME
        value: "herbal_medicine_db"
      - key: DB_USER
        value: "postgres"
      - key: DB_HOST
        value: "aws-us-east-1.render.com"
      - key: DB_PORT
        value: "5432"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DB_PASSWORD
        generateValue: true

  # ──────────────────────────────────────────────────────────────
  # Frontend — React SPA (Node.js)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: herbal-medicine-frontend
    runtime: node
    region: oma
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s build"
    envVars:
      - key: REACT_APP_API_ORIGIN
        value: "https://herbal-medicine-api.onrender.com"
